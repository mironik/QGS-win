[workspace]
members = [
    "crates/qgs-codec-h264",
    "crates/qgs-audio-pipewire",
    "crates/qgs-broadcast-player",
    "crates/qgs-core",
    "crates/qgs-h264-422p10",
    "crates/qgs-linux",
    "crates/qgs-mp4",
    "crates/qgs-mxf",
    "crates/qgs-media-runtime",
    "crates/qnc-qgs-contract",
    "crates/qnc-qgs-bridge",
    "crates/qgs-protocol",
    "crates/qgs-software-video",
    "crates/qgs-vaapi",
    "crates/qgs-vulkan",
    "crates/qgs-windows",
    "daemon/qgsd",
    "tools/qgs-test",
    "tools/qgs-win",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
